[workspace]
resolver = "3"
members = ["crates/cent", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV: the floor set by tokio, hyper-util, hyper-rustls and
# rustls-platform-verifier. CI reads it from here.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/centrifugal/rustcent"
homepage = "https://centrifugal.dev"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Errors are documented once, on the `Error` type and in the crate docs:
# every call returns the same kinds.
missing_errors_doc = "allow"
module_name_repetitions = "allow"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unwrap_used = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
